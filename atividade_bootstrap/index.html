<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> 
</head>
<body>
    <header class="topo">
        <h1>Formulário de cadastro</h1>
    </header>
    <div class="container">
        <div class="row">
            <div class="col">
                <h2>Entre em contato</h2>
                <form>
                    <label for="nome">Seu nome</label>
                    <input class="border border-dark p-2 form-control" style="width: 30%;" style="--bs-border-opacity: .9;" class="form-control-md" type="text" name="" id="name">
                    <label for="email">Seu e-mail</label>
                    <input class="border border-dark p-2 form-control " style="width: 30%;" class="form-control" type="email" name="" id="email">
                    <label for="telefone">Seu número</label>
                    <input class="border border-dark p-2 form-control " class="form-control" style="width: 30%;" type="tel" name="" id="telefone">
                    <div class="form-check form-switch">
                        <label class="form-check-label" for="aceito-termos">Aceito os termos de usuário</label>
                        <input class="form-check-input " class="dark" type="checkbox" name="" id="">
                    </div>
                    <button class="btn btn-success">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
